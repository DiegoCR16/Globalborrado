<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Exchange - Registro y Gestión de Clientes (PSE-2)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Global Exchange - Módulo Clientes</a>
            <span class="navbar-text text-white">Usuario: {{ username }}</span>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="mb-4">Gestión, Registro y Perfil de Clientes (PSE-2)</h1>
        
        <div class="row">
            <div class="col-md-5">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">Registrar Nuevo Cliente</div>
                    <div class="card-body">
                        <form id="createCustomerForm">
                            <div class="mb-3">
                                <label for="firstName" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="mb-3">
                                <label for="lastName" class="form-label">Apellido</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                            <div class="mb-3">
                                <label for="documentNumber" class="form-label">Nro. Documento / RUC</label>
                                <input type="text" class="form-control" id="documentNumber" required>
                            </div>
                            <div class="mb-3">
                                <label for="clientType" class="form-label">Tipo de Cliente (Segmentación)</label>
                                <select class="form-select" id="clientType">
                                    <option value="RETAIL">Minorista</option>
                                    <option value="CORPORATE">Corporativo</option>
                                    <option value="VIP">VIP</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Teléfono</label>
                                <input type="text" class="form-control" id="phone">
                            </div>
                            <div class="mb-3">
                                <label for="address" class="form-label">Dirección</label>
                                <textarea class="form-control" id="address" rows="2"></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Registrar Cliente</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <label for="filterType" class="form-label fw-bold">Filtrar por Segmentación:</label>
                        <select class="form-select" id="filterType" onchange="fetchCustomers()">
                            <option value="">Todos los Clientes</option>
                            <option value="RETAIL">Minorista</option>
                            <option value="CORPORATE">Corporativo</option>
                            <option value="VIP">VIP</option>
                        </select>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">Clientes Registrados</div>
                    <div class="card-body">
                        <div id="customersList" class="list-group">
                            <p class="text-muted">Cargando clientes...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchCustomers() {
            try {
                const filter = document.getElementById('filterType').value;
                let url = '/api/customers/';
                if (filter) url += `?client_type=${filter}`;
                
                const res = await fetch(url);
                const data = await res.json();
                const container = document.getElementById('customersList');
                container.innerHTML = '';
                if (data.length === 0) {
                    container.innerHTML = '<p class="text-muted">No hay clientes registrados.</p>';
                    return;
                }
                data.forEach(c => {
                    let badgeClass = c.client_type === 'VIP' ? 'bg-warning text-dark' : (c.client_type === 'CORPORATE' ? 'bg-primary' : 'bg-secondary');
                    let item = document.createElement('div');
                    item.className = 'list-group-item d-flex justify-content-between align-items-center flex-column align-items-start mb-2';
                    item.innerHTML = `
                        <div class="w-100 d-flex justify-content-between">
                            <h5 class="mb-1">${c.first_name} ${c.last_name} <span class="badge ${badgeClass}">${c.client_type}</span> ${c.is_active ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-danger">Inactivo</span>'}</h5>
                            <small class="text-muted">Doc: ${c.document_number}</small>
                        </div>
                        <p class="mb-1 text-muted">Email: ${c.email} | Tel: ${c.phone || 'N/A'}</p>
                        <p class="mb-1 text-muted"><small>Dirección: ${c.address || 'N/A'}</small></p>
                        <div>
                            <button class="btn btn-sm btn-outline-danger" onclick="deactivateCustomer(${c.id})">Desactivar</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('createCustomerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const first_name = document.getElementById('firstName').value;
            const last_name = document.getElementById('lastName').value;
            const document_number = document.getElementById('documentNumber').value;
            const client_type = document.getElementById('clientType').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;

            const res = await fetch('/api/customers/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ first_name, last_name, document_number, client_type, email, phone, address })
            });

            if (res.ok) {
                document.getElementById('createCustomerForm').reset();
                fetchCustomers();
            } else {
                const errData = await res.json();
                alert('Error al registrar cliente: ' + JSON.stringify(errData));
            }
        });

        async function deactivateCustomer(id) {
            if (!confirm('¿Seguro que desea desactivar este cliente?')) return;
            const res = await fetch(`/api/customers/${id}/`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            });
            if (res.ok) {
                fetchCustomers();
            } else {
                alert('Error al desactivar cliente');
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        fetchCustomers();
    </script>
</body>
</html>
