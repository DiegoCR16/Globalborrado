<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Exchange - Límites Transaccionales y Alertas KYC (PSE-6)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Global Exchange - Cumplimiento y Límites (PSE-6)</a>
            <span class="navbar-text text-white">Usuario: {{ username }}</span>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="mb-4">Gestión de Límites Transaccionales y Alertas KYC (PSE-6)</h1>
        
        <div class="row">
            <!-- Parameterization of Limits -->
            <div class="col-md-5">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">Parametrización de Límites por Perfil</div>
                    <div class="card-body">
                        <form id="limitForm">
                            <div class="mb-3">
                                <label for="clientType" class="form-label">Tipo de Cliente (Perfil)</label>
                                <select class="form-select" id="clientType" required>
                                    <option value="RETAIL">Minorista</option>
                                    <option value="CORPORATE">Corporativo</option>
                                    <option value="VIP">VIP</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="minAmount" class="form-label">Monto Mínimo (PYG)</label>
                                <input type="number" step="0.01" class="form-control" id="minAmount" value="50000" required>
                            </div>
                            <div class="mb-3">
                                <label for="maxAmount" class="form-label">Monto Máximo (PYG)</label>
                                <input type="number" step="0.01" class="form-control" id="maxAmount" value="1000000000" required>
                            </div>
                            <div class="mb-3">
                                <label for="dailyLimit" class="form-label">Límite Diario (PYG)</label>
                                <input type="number" step="0.01" class="form-control" id="dailyLimit" value="5000000000" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Guardar Parámetros de Límite</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- KYC Compliance Alerts -->
            <div class="col-md-7">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                        <span>Alertas de Cumplimiento KYC</span>
                        <button class="btn btn-sm btn-light" onclick="fetchKYCAlerts()">Actualizar Alertas</button>
                    </div>
                    <div class="card-body">
                        <div id="alertsList" class="list-group">
                            <p class="text-muted">Cargando alertas KYC...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchKYCAlerts() {
            try {
                const res = await fetch('/api/kyc-alerts/');
                const data = await res.json();
                const container = document.getElementById('alertsList');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<p class="text-muted">No hay alertas KYC registradas.</p>';
                    return;
                }

                data.forEach(alert => {
                    let badgeClass = alert.status === 'RESOLVED' ? 'bg-success' : (alert.status === 'REVIEWED' ? 'bg-warning text-dark' : 'bg-danger');
                    let item = document.createElement('div');
                    item.className = 'list-group-item d-flex justify-content-between align-items-center flex-column align-items-start mb-2';
                    item.innerHTML = `
                        <div class="w-100 d-flex justify-content-between">
                            <h5 class="mb-1">[${alert.alert_type}] Cliente: ${alert.customer_name} <span class="badge ${badgeClass}">${alert.status}</span></h5>
                            <small class="text-muted">Monto: ${alert.amount} PYG</small>
                        </div>
                        <p class="mb-1 text-muted"><small>${alert.details || 'Sin detalles'}</small></p>
                        <div class="mt-2 d-flex gap-2">
                            <button class="btn btn-sm btn-outline-warning" onclick="updateAlertStatus(${alert.id}, 'REVIEWED')">Revisar</button>
                            <button class="btn btn-sm btn-outline-success" onclick="updateAlertStatus(${alert.id}, 'RESOLVED')">Resolver</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('limitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const client_type = document.getElementById('clientType').value;
            const min_amount = document.getElementById('minAmount').value;
            const max_amount = document.getElementById('maxAmount').value;
            const daily_limit = document.getElementById('dailyLimit').value;

            const res = await fetch('/api/limits/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ client_type, min_amount, max_amount, daily_limit })
            });

            if (res.ok) {
                alert('Límites transaccionales parametrizados exitosamente.');
                fetchKYCAlerts();
            } else {
                const errData = await res.json();
                alert('Error al guardar límites: ' + JSON.stringify(errData));
            }
        });

        async function updateAlertStatus(alertId, newStatus) {
            const res = await fetch(`/api/kyc-alerts/${alertId}/`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ status: newStatus })
            });

            if (res.ok) {
                alert('Estado de alerta KYC actualizado correctamente.');
                fetchKYCAlerts();
            } else {
                alert('Error al actualizar alerta KYC.');
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        fetchKYCAlerts();
    </script>
</body>
</html>
