<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Exchange - Menú Principal y Navegación Dinámica (PSE-28)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Dynamic Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Global Exchange</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                <ul class="navbar-nav" id="dynamicMenuNav">
                    <!-- Dynamic menu items injected via JavaScript / API -->
                    <li class="nav-item">
                        <a class="nav-link active" href="/dashboard/">Dashboard</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white gap-3">
                    <span id="userInfoDisplay">Usuario: {{ username }} <span class="badge bg-primary" id="userRoleBadge">Cargando...</span></span>
                    <button class="btn btn-outline-light btn-sm" onclick="secureLogout()">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-md-12">
                <div class="card shadow-sm p-4">
                    <h1 class="mb-3">Panel Principal Global Exchange</h1>
                    <p class="text-muted">Bienvenido al sistema central de operaciones cambiarias. Su menú y accesos se adaptan dinámicamente según sus permisos y rol asignado.</p>
                    <hr>
                    <div id="moduleCardsContainer" class="row g-4">
                        <!-- Dynamic module shortcut cards -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadUserMenu() {
            try {
                const res = await fetch('/api/menu/');
                const data = await res.json();
                
                // Update user header
                document.getElementById('userRoleBadge').innerText = data.role;
                document.getElementById('userInfoDisplay').innerHTML = `Usuario: <strong>${data.username}</strong> <span class="badge bg-primary">${data.role}</span>`;

                const navContainer = document.getElementById('dynamicMenuNav');
                const cardsContainer = document.getElementById('moduleCardsContainer');
                navContainer.innerHTML = '';
                cardsContainer.innerHTML = '';

                data.menu_items.forEach(item => {
                    // Navbar item
                    let navItem = document.createElement('li');
                    navItem.className = 'nav-item';
                    navItem.innerHTML = `<a class="nav-link" href="${item.url}">${item.name}</a>`;
                    navContainer.appendChild(navItem);

                    // Card item
                    let col = document.createElement('div');
                    col.className = 'col-md-4';
                    col.innerHTML = `
                        <div class="card h-100 shadow-sm border-0 bg-white">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    <h5 class="card-title text-dark fw-bold">${item.name}</h5>
                                    <p class="card-text text-muted small">${item.description || 'Módulo autorizado del sistema.'}</p>
                                </div>
                                <a href="${item.url}" class="btn btn-outline-dark mt-3 w-100">Acceder al Módulo</a>
                            </div>
                        </div>
                    `;
                    cardsContainer.appendChild(col);
                });
            } catch (err) {
                console.error('Error cargando menú dinámico:', err);
            }
        }

        function secureLogout() {
            localStorage.removeItem('access_token');
            alert('Sesión cerrada de forma segura.');
            window.location.href = '/api/auth/login/'; // or login page
        }

        loadUserMenu();
    </script>
</body>
</html>
