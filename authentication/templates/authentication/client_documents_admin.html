<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Exchange - Gestión Documental KYC (PSE-7)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Global Exchange - Gestión Documental y KYC (PSE-7)</a>
            <span class="navbar-text text-white">Usuario: {{ username }}</span>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="mb-4">Carga, Visualización y Auditoría de Documentos KYC (PSE-7)</h1>
        
        <div class="row">
            <!-- Upload Document Form -->
            <div class="col-md-5">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">Subir Documento Digitalizado</div>
                    <div class="card-body">
                        <form id="uploadDocForm">
                            <div class="mb-3">
                                <label for="customerId" class="form-label">ID del Cliente</label>
                                <input type="number" class="form-control" id="customerId" placeholder="Ej: 1" required>
                            </div>
                            <div class="mb-3">
                                <label for="documentType" class="form-label">Tipo de Documento</label>
                                <select class="form-select" id="documentType" required>
                                    <option value="CI_FRONT">Cédula de Identidad (Anverso)</option>
                                    <option value="CI_BACK">Cédula de Identidad (Reverso)</option>
                                    <option value="RUC_CERT">Certificado de RUC</option>
                                    <option value="INCOME_PROOF">Comprobante de Ingresos</option>
                                    <option value="KYC_FORM">Formulario KYC Completado</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="fileName" class="form-label">Nombre del Archivo</label>
                                <input type="text" class="form-control" id="fileName" placeholder="Ej: cedula_anverso.pdf" required>
                            </div>
                            <div class="mb-3">
                                <label for="fileUrl" class="form-label">URL / Ruta de Almacenamiento</label>
                                <input type="text" class="form-control" id="fileUrl" placeholder="/media/docs/cedula.pdf">
                            </div>
                            <button type="submit" class="btn btn-success w-100">Subir y Registrar Documento</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Documents Audit List -->
            <div class="col-md-7">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                        <span>Auditoría de Documentación Adjunta</span>
                        <button class="btn btn-sm btn-light" onclick="fetchDocuments()">Actualizar</button>
                    </div>
                    <div class="card-body">
                        <div id="documentsList" class="list-group">
                            <p class="text-muted">Cargando documentos...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchDocuments() {
            try {
                const res = await fetch('/api/documents/');
                const data = await res.json();
                const container = document.getElementById('documentsList');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<p class="text-muted">No hay documentos registrados.</p>';
                    return;
                }

                data.forEach(doc => {
                    let badgeClass = doc.status === 'VERIFIED' ? 'bg-success' : (doc.status === 'REJECTED' ? 'bg-danger' : 'bg-warning text-dark');
                    let item = document.createElement('div');
                    item.className = 'list-group-item d-flex justify-content-between align-items-center flex-column align-items-start mb-2';
                    item.innerHTML = `
                        <div class="w-100 d-flex justify-content-between">
                            <h5 class="mb-1">${doc.document_type_display} <span class="badge ${badgeClass}">${doc.status_display}</span></h5>
                            <small class="text-muted">Cliente: ${doc.customer_name}</small>
                        </div>
                        <p class="mb-1 text-muted"><small>Archivo: <strong>${doc.file_name}</strong> | Ruta: ${doc.file_url || 'N/A'}</small></p>
                        <div class="mt-2 d-flex gap-2">
                            <button class="btn btn-sm btn-outline-success" onclick="auditDocument(${doc.id}, 'VERIFIED')">Aprobar</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="auditDocument(${doc.id}, 'REJECTED')">Rechazar</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('uploadDocForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const customer = document.getElementById('customerId').value;
            const document_type = document.getElementById('documentType').value;
            const file_name = document.getElementById('fileName').value;
            const file_url = document.getElementById('fileUrl').value;

            const res = await fetch('/api/documents/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ customer, document_type, file_name, file_url })
            });

            if (res.ok) {
                alert('Documento subido y registrado exitosamente.');
                document.getElementById('uploadDocForm').reset();
                fetchDocuments();
            } else {
                const errData = await res.json();
                alert('Error al subir documento: ' + JSON.stringify(errData));
            }
        });

        async function auditDocument(docId, newStatus) {
            const res = await fetch(`/api/documents/${docId}/`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ status: newStatus })
            });

            if (res.ok) {
                alert('Estado del documento actualizado correctamente.');
                fetchDocuments();
            } else {
                alert('Error al auditar documento.');
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        fetchDocuments();
    </script>
</body>
</html>
