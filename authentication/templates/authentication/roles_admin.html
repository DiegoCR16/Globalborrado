<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Exchange - Gestión de Roles y Permisos (PSE-26)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Global Exchange - Administración</a>
            <span class="navbar-text text-white">Usuario: {{ username }}</span>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="mb-4">Gestión de Roles y Permisos (PSE-26)</h1>
        
        <div class="row">
            <div class="col-md-5">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">Crear Nuevo Rol</div>
                    <div class="card-body">
                        <form id="createRoleForm">
                            <div class="mb-3">
                                <label for="roleName" class="form-label">Nombre del Rol</label>
                                <input type="text" class="form-control" id="roleName" required>
                            </div>
                            <div class="mb-3">
                                <label for="roleDesc" class="form-label">Descripción</label>
                                <textarea class="form-control" id="roleDesc" rows="2"></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Crear Rol</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">Roles Registrados</div>
                    <div class="card-body">
                        <div id="rolesList" class="list-group">
                            <p class="text-muted">Cargando roles...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchRoles() {
            try {
                const res = await fetch('/api/roles/');
                const data = await res.json();
                const container = document.getElementById('rolesList');
                container.innerHTML = '';
                if (data.length === 0) {
                    container.innerHTML = '<p class="text-muted">No hay roles registrados.</p>';
                    return;
                }
                data.forEach(role => {
                    let perms = role.permissions.map(p => `<span class="badge bg-info text-dark me-1">${p.name}</span>`).join('');
                    let item = document.createElement('div');
                    item.className = 'list-group-item d-flex justify-content-between align-items-center flex-column align-items-start mb-2';
                    item.innerHTML = `
                        <div class="w-100 d-flex justify-content-between">
                            <h5 class="mb-1">${role.name} ${role.is_active ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-danger">Inactivo</span>'}</h5>
                            <small class="text-muted">Keycloak Sync: ${role.keycloak_synced ? 'Sincronizado' : 'Pendiente'}</small>
                        </div>
                        <p class="mb-1 text-muted">${role.description || 'Sin descripción'}</p>
                        <div class="mb-2"><strong>Permisos:</strong> ${perms || 'Ninguno'}</div>
                        <div>
                            <button class="btn btn-sm btn-outline-danger" onclick="deactivateRole(${role.id})">Desactivar</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('createRoleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('roleName').value;
            const description = document.getElementById('roleDesc').value;

            const res = await fetch('/api/roles/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ name, description })
            });

            if (res.ok) {
                document.getElementById('createRoleForm').reset();
                fetchRoles();
            } else {
                alert('Error al crear rol');
            }
        });

        async function deactivateRole(id) {
            if (!confirm('¿Seguro que desea desactivar este rol?')) return;
            const res = await fetch(`/api/roles/${id}/`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            });
            if (res.ok) {
                fetchRoles();
            } else {
                alert('Error al desactivar rol');
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        fetchRoles();
    </script>
</body>
</html>
